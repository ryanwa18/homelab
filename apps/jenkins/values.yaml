jenkins:
  controller:
    # Jenkins admin credentials (CHANGE THESE!)
    admin:
      username: admin
      password: changeme

    # Jenkins configuration
    jenkinsUrl: "https://jenkins.homelab.local"
    jenkinsUriPrefix: "/"

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # JVM options
    javaOpts: "-Xms2g -Xmx2g"

    # Health probe configuration - fix 403 errors on /login endpoint
    healthProbes: true
    healthProbesLivenessTimeout: 5
    healthProbesReadinessTimeout: 5
    healthProbeLivenessPeriodSeconds: 10
    healthProbesLivenessFailureThreshold: 5
    healthProbesReadinessPeriodSeconds: 10
    healthProbesReadinessFailureThreshold: 3
    healthProbesStartupTimeout: 5
    healthProbesStartupPeriodSeconds: 10
    healthProbesStartupFailureThreshold: 24
    # Increase initial delay to give Jenkins time to fully start
    healthProbeLivenessInitialDelay: 90
    healthProbeReadinessInitialDelay: 60

    # Ingress configuration
    ingress:
      enabled: true
      ingressClassName: traefik
      hostName: jenkins.homelab.local
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls:
        - secretName: jenkins-tls
          hosts:
            - jenkins.homelab.local

    # Jenkins Configuration as Code (JCasC)
    JCasC:
      enabled: true
      defaultConfig: false
      configScripts:
        jenkins-config: |
          jenkins:
            systemMessage: "Welcome to Jenkins!"
            numExecutors: 0
            mode: EXCLUSIVE
            securityRealm:
              local:
                allowsSignup: false
            authorizationStrategy:
              loggedInUsersCanDoAnything:
                allowAnonymousRead: true
          unclassified:
            location:
              url: "https://jenkins.homelab.local"

    # Install essential plugins only (to avoid init timeout)
    installPlugins:
      - kubernetes:latest
      - workflow-aggregator:latest
      - git:latest
      - configuration-as-code:latest

  # Persistent storage for Jenkins home
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
    accessMode: ReadWriteOnce

  # Service account
  serviceAccount:
    create: true
    name: jenkins

  # Enable RBAC
  rbac:
    create: true
    readSecrets: true

  # Disable ServiceMonitor (requires kube-prometheus-stack CRDs)
  prometheus:
    enabled: false
    serviceMonitorAdditionalLabels: {}

  # Agent configuration (for Kubernetes-based build agents)
  agent:
    enabled: true
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
