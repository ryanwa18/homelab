ingress-nginx:
  controller:
    # Replica count for high availability
    replicaCount: 2

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Use IngressClass
    ingressClassResource:
      name: nginx
      enabled: true
      default: true
      controllerValue: "k8s.io/ingress-nginx"

    # Enable Prometheus metrics
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          prometheus: kube-prometheus

    # Admission webhooks
    admissionWebhooks:
      enabled: true

    # Service configuration
    service:
      enabled: true
      type: LoadBalancer

    # Update strategy
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1

  # Default backend (optional)
  defaultBackend:
    enabled: false
