kube-prometheus-stack:
  # Prometheus configuration
  prometheus:
    prometheusSpec:
      # Data retention period
      retention: 30d

      # Persistent storage for Prometheus
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

      # Enable automatic discovery of ServiceMonitors
      serviceMonitorSelector:
        matchLabels:
          prometheus: kube-prometheus

      # Allow ServiceMonitors from all namespaces
      serviceMonitorNamespaceSelector: {}

      # Resource limits
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      # Enable remote write (for OpenTelemetry integration)
      enableRemoteWriteReceiver: true

  # Grafana configuration
  grafana:
    enabled: true

    # Admin credentials (CHANGE THESE!)
    adminUser: admin
    adminPassword: changeme

    # Persistent storage for Grafana
    persistence:
      enabled: true
      storageClassName: standard
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    # Ingress configuration
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.homelab.local
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.homelab.local

    # Pre-configure datasources
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
            isDefault: true
            access: proxy
            jsonData:
              timeInterval: 30s
          - name: Tempo
            type: tempo
            url: http://tempo.observability.svc:3100
            access: proxy
            jsonData:
              tracesToMetrics:
                datasourceUid: prometheus
              serviceMap:
                datasourceUid: prometheus
              nodeGraph:
                enabled: true
              tracesToLogsV2:
                datasourceUid: ""

    # Dashboard providers - auto-discover dashboards from ConfigMaps
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: jenkins
            orgId: 1
            folder: Jenkins
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/jenkins

    # Dashboard definitions
    dashboards:
      jenkins:
        jenkins-pipeline-traces:
          json: |
            {
              "annotations": { "list": [] },
              "description": "Jenkins Pipeline Monitoring - Trace bottlenecks with Tempo",
              "editable": true,
              "fiscalYearStartMonth": 0,
              "graphTooltip": 0,
              "id": null,
              "links": [],
              "panels": [
                {
                  "title": "Pipeline Traces",
                  "type": "traces",
                  "datasource": { "type": "tempo", "uid": "tempo" },
                  "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
                  "targets": [
                    {
                      "datasource": { "type": "tempo", "uid": "tempo" },
                      "queryType": "traceqlSearch",
                      "filters": [
                        {
                          "id": "service-name",
                          "tag": "service.name",
                          "operator": "=",
                          "value": ["jenkins"],
                          "scope": "resource"
                        }
                      ],
                      "limit": 20
                    }
                  ]
                },
                {
                  "title": "Pipeline Duration Over Time",
                  "type": "timeseries",
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
                  "targets": [
                    {
                      "expr": "jenkins_job_duration_milliseconds_summary{quantile=\"0.99\"}",
                      "legendFormat": "{{ jenkins_job }} p99",
                      "refId": "A"
                    },
                    {
                      "expr": "jenkins_job_duration_milliseconds_summary{quantile=\"0.5\"}",
                      "legendFormat": "{{ jenkins_job }} p50",
                      "refId": "B"
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ms",
                      "custom": { "drawStyle": "line", "fillOpacity": 10 }
                    }
                  }
                },
                {
                  "title": "Pipeline Success/Failure Rate",
                  "type": "timeseries",
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
                  "targets": [
                    {
                      "expr": "sum(rate(jenkins_runs_success_total[5m])) by (jenkins_job)",
                      "legendFormat": "{{ jenkins_job }} success",
                      "refId": "A"
                    },
                    {
                      "expr": "sum(rate(jenkins_runs_failure_total[5m])) by (jenkins_job)",
                      "legendFormat": "{{ jenkins_job }} failure",
                      "refId": "B"
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "custom": { "drawStyle": "line", "fillOpacity": 10 }
                    }
                  }
                },
                {
                  "title": "Node Graph - Pipeline Service Map",
                  "type": "nodeGraph",
                  "datasource": { "type": "tempo", "uid": "tempo" },
                  "gridPos": { "h": 10, "w": 24, "x": 0, "y": 20 },
                  "targets": [
                    {
                      "datasource": { "type": "tempo", "uid": "tempo" },
                      "queryType": "traceqlSearch",
                      "filters": [
                        {
                          "id": "service-name",
                          "tag": "service.name",
                          "operator": "=",
                          "value": ["jenkins"],
                          "scope": "resource"
                        }
                      ],
                      "limit": 20
                    }
                  ]
                }
              ],
              "schemaVersion": 39,
              "tags": ["jenkins", "pipelines", "traces"],
              "templating": { "list": [] },
              "time": { "from": "now-6h", "to": "now" },
              "title": "Jenkins Pipeline Traces",
              "uid": "jenkins-pipeline-traces"
            }

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Alertmanager configuration
  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  # Disable components not needed in homelab
  kubeEtcd:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  # Node exporter - collect metrics from nodes
  nodeExporter:
    enabled: true

  # Kube-state-metrics - collect Kubernetes object metrics
  kubeStateMetrics:
    enabled: true

  # Prometheus Operator configuration
  prometheusOperator:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
