cert-manager:
  # Install CRDs
  installCRDs: true

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Webhook configuration
  webhook:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # CA Injector configuration
  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Prometheus metrics (ServiceMonitor applied after kube-prometheus-stack is installed)
  prometheus:
    enabled: true
    servicemonitor:
      enabled: false

  # Global configuration
  global:
    leaderElection:
      namespace: cert-manager
